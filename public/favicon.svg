<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4edea3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2db885;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circular background -->
